name: "manybody-moment-projection"
version: "0.1.0"
description: "Differentiable ensemble-level projection toward smooth pair moments."

build_config:
  python_version: "3.11"
  package_data:
    - ["../../src/manybody_completion", "/tesseract/manybody_completion"]

metadata:
  derivative_mode: "unrolled_reverse_mode"
  forward_solver: "ridge_regularized_sqp_projection"
  coefficient_whitening: "diagonal_scales"
  basis_pruning: "explicit_mask"
  geometry: "smooth_periodic_chord"
  methodology_equations: [13, 14, 15, 16]
