# Fair four-mode ablation on the existing deterministic two-condition fixture.
seed: 3
dtype: float64
dataset: data/tiny_smoke.npz
target_indices: [1, 3]
condition_scale_floor: 0.01
projection_moment_scales: unit

latent_anchors:
  grid_shape: [3, 2]
  jitter_scale: 0.025

model:
  latent_dim: 3
  hidden_dim: 12
  message_dim: 12
  num_message_passing_steps: 2
  radial_basis_size: 6
  radial_min: 0.0
  radial_max: 0.48
  radial_width: 0.10
  max_coordinate_update: 0.08

physical:
  r0: 0.12
  kappa: 30.0
  prox_strength: 0.05

relaxation:
  num_steps: 32
  step_size: 0.05
  tolerance: 0.002
  max_update_norm: 0.04
  line_search_steps: 8
  line_search_shrink: 0.5
  armijo_coefficient: 0.0001

projection:
  num_steps: 30
  tolerance: 0.00002
  kkt_tolerance: 0.005
  ridge: 1.0e-7
  svd_rcond: 1.0e-7
  damping: 1.0
  max_step_norm: 0.08
  max_correction_norm: 0.5
  line_search_steps: 10
  line_search_shrink: 0.5
  sufficient_decrease: 0.0001
  merit_penalty: 10.0

objective:
  observed: 1000.0
  physical: 0.1
  correction: 1000.0
  preprojection_observed: 0.0

training:
  num_steps: 15
  learning_rate: 0.002
  beta1: 0.9
  beta2: 0.999
  epsilon: 1.0e-8
  gradient_clip_norm: 5.0
  weight_decay: 0.0

finite_difference:
  modes: [base, relax_e2e, full_e2e]
  direction_seed: 321
  epsilons: [0.003, 0.001, 0.0003, 0.0001]

acceptance:
  minimum_loss_reduction_factor: 1.02
  maximum_full_projected_moment_error: 0.0001
  maximum_gradient_relative_error: 0.00002
  minimum_relaxation_convergence_rate: 1.0
  minimum_projection_convergence_rate: 1.0
  maximum_rank_deficient_rate: 0.0
  maximum_base_post_hoc_parameter_distance: 0.0
  maximum_full_vs_post_hoc_correction_ratio: 1.01
