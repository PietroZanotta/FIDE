flow_ablation_config: configs/homometric_ablation_micro.yaml

classical_baselines:
  rmc:
    num_steps: 50
    proposal_scale: 0.10
    initial_temperature: 0.05
    final_temperature: 0.005
    physical_weight: 0.0
    physical_r0: 0.22
    physical_kappa: 20.0
    trace_stride: 10
  ibi:
    num_iterations: 2
    metropolis_steps_per_iteration: 20
    proposal_scale: 0.09
    inverse_temperature: 1.0
    update_rate: 0.35
    num_bins: 8
    radial_max: 0.48
    kernel_width: 0.04
    density_floor: 1.0e-4
    potential_clip: 8.0
    initial_repulsion: 1.0

uq:
  interval_levels: [0.50, 0.80, 0.90]
  confidence: 0.95
  bootstrap_resamples: 100

decision_rules:
  pair_error_noninferiority_margin: 1.0
  mode_tv_noninferiority_margin: 1.0
  reference_distance_noninferiority_margin: 1.0
