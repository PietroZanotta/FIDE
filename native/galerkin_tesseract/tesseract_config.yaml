name: "mfsi-galerkin-cpp"
version: "1.0.0"
description: "Forward-only fixed-feature Galerkin K/f chunk assembly"
build_config:
  target_platform: "native"
  extra_packages: [build-essential, cmake, libblas-dev]
  package_data:
    - [src, src]
    - [CMakeLists.txt, CMakeLists.txt]
  custom_build_steps:
    - |
      RUN python -m pip install pybind11 scipy && \
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && \
          cmake --build build -j

