name: manybody-scientific-dual-calibration
version: 0.3.0
entrypoint: tesseract_api:apply
description: Warm-started covariance-Newton calibration with nested corrected tilted-ensemble calls.
inputs:
  - prior_probabilities
  - n_spins
  - target_moment
  - sampler_options
  - calibration_options
  - seed
  - proposal_model    # optional serialized ProposalModel passed to Tesseract 1
  - warm_start_model  # optional serialized WarmStartModel
outputs:
  - initial_dual
  - dual
  - status
  - fit_trace
  - residual_uncertainty
  - final_ensemble
