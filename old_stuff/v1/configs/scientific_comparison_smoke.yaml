flow_ablation_config: configs/homometric_ablation_smoke.yaml
# Remove or ignore this field when forcing a complete rerun. It lets the smoke
# comparison reuse the already validated flow artifact during rapid debugging.
reuse_flow_artifacts: artifacts/smoke

classical_baselines:
  rmc:
    num_steps: 220
    proposal_scale: 0.08
    initial_temperature: 0.05
    final_temperature: 0.002
    physical_weight: 0.0
    physical_r0: 0.22
    physical_kappa: 30.0
    trace_stride: 20
  ibi:
    num_iterations: 4
    metropolis_steps_per_iteration: 120
    proposal_scale: 0.07
    inverse_temperature: 1.0
    update_rate: 0.35
    num_bins: 20
    radial_max: 0.48
    kernel_width: 0.028
    density_floor: 1.0e-4
    potential_clip: 12.0
    initial_repulsion: 1.0

uq:
  interval_levels: [0.50, 0.80, 0.90]
  confidence: 0.95
  bootstrap_resamples: 500

decision_rules:
  pair_error_noninferiority_margin: 0.02
  mode_tv_noninferiority_margin: 0.15
  reference_distance_noninferiority_margin: 0.20
