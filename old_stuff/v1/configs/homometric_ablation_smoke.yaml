seed: 20260805
dtype: float64
box: [1.0, 1.0]

solver_backend:
  kind: local_jax
  transport: url
  relaxation_url: http://127.0.0.1:8001
  projection_url: http://127.0.0.1:8002

dataset:
  samples_per_mode: 12
  validation_per_mode: 3
  num_replicas: 4

pair_basis:
  num_basis: 6
  r_min: 0.16
  r_max: 0.43
  width: 0.045

angular:
  orders: [1, 2, 3, 4, 5, 6]
  neighbor_scale: 0.20
  scale_floor: 0.05
  far_threshold: 3.0

network:
  hidden_dim: 12
  message_dim: 12
  num_layers: 2
  radial_basis_size: 6
  radial_max: 0.50
  radial_width: 0.09
  time_frequencies: 3
  velocity_scale: 2.0

pretraining:
  learning_rate: 0.002
  num_steps: 16
  batch_size: 4
  gradient_clip_norm: 5.0

fine_tuning:
  learning_rate: 0.0008
  num_steps: 3
  batch_size: 2
  gradient_clip_norm: 5.0

training_sampling:
  num_steps: 2
  method: euler

objective_weights:
  flow_matching: 1.0
  observed: 20.0
  physical: 2.0
  correction: 20.0

physical:
  r0: 0.22
  kappa: 30.0

relaxation:
  num_steps: 4
  step_size: 0.08
  prox_strength: 0.15
  max_particle_step: 0.05
  tolerance: 0.015

projection:
  num_steps: 5
  ridge: 1.0e-6
  max_particle_step: 0.08
  tolerance: 0.08
  rank_tolerance: 1.0e-7

evaluation:
  num_ensembles: 12
  overlap_threshold: 0.20
  bootstrap_resamples: 500
  sampling:
    num_steps: 6
    method: heun

gradient_check:
  enabled: false
  batch_size: 1
  relaxation_steps: 1
  projection_steps: 1
  epsilons: [0.001, 0.0003]
  sampling:
    num_steps: 1
    method: euler

decision_rules:
  pair_error_noninferiority_margin: 0.02
  mode_tv_noninferiority_margin: 0.15
