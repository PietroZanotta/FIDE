flow_ablation_config: configs/homometric_ablation_full.yaml

classical_baselines:
  rmc:
    num_steps: 4000
    proposal_scale: 0.05
    initial_temperature: 0.03
    final_temperature: 0.0002
    physical_weight: 0.0
    physical_r0: 0.22
    physical_kappa: 30.0
    trace_stride: 100
  ibi:
    num_iterations: 20
    metropolis_steps_per_iteration: 1200
    proposal_scale: 0.06
    inverse_temperature: 1.0
    update_rate: 0.20
    num_bins: 48
    radial_max: 0.48
    kernel_width: 0.015
    density_floor: 1.0e-5
    potential_clip: 20.0
    initial_repulsion: 1.0
    convergence_window: 5
    convergence_relative_tolerance: 0.10
    density_rmse_tolerance: 0.01

uq:
  interval_levels: [0.50, 0.80, 0.90, 0.95]
  confidence: 0.95
  bootstrap_resamples: 5000

decision_rules:
  pair_error_noninferiority_margin: 0.01
  mode_tv_noninferiority_margin: 0.10
  reference_distance_noninferiority_margin: 0.10
