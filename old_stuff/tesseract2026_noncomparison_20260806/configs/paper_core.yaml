# First bounded configuration from Section 7.1: N=32, M in {8,16}, R in [8,16].
seed: 20260805
dtype: float64
box: [1.0, 1.0]
num_particles: 32
num_replicas: 8
samples_per_regime: 64
overlap_threshold: 0.08
angular_orders: [1, 2, 3, 4, 6, 8]

pair_basis:
  num_basis: 12
  r_min: 0.035
  r_max: 0.68
  width: 0.065

simulator:
  num_steps: 4000
  time_step: 0.00015
  temperature: 0.012
  max_drift_norm: 0.025
  record_every: 0

regimes:
  - name: isotropic_pair
    family: pair
    energy:
      r0: 0.11
      kappa: 45.0
      pair_strength: 1.0
      angular_strength: 0.0
      angular_target_cosine: 0.0
      angular_neighbor_scale: 0.18

  - name: angular_squarelike
    family: angular
    energy:
      r0: 0.11
      kappa: 45.0
      pair_strength: 1.0
      angular_strength: 0.25
      angular_target_cosine: 0.0
      angular_neighbor_scale: 0.18
