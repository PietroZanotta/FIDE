# Conditional equivariant flow matching on the calibration toy archive.
seed: 73
dtype: float64
dataset: data/calibration_smoke.npz
dataset_metadata: data/calibration_smoke.json
condition_scale_floor: 0.003
angular_scale_floor: 0.005

split:
  seed: 2026
  validation_per_regime: 2

minibatching:
  batch_size: 4
  num_epochs: 30
  shuffle_seed: 2718

model:
  latent_dim: 3
  hidden_dim: 16
  message_dim: 16
  num_message_passing_steps: 2
  radial_basis_size: 6
  radial_min: 0.0
  radial_max: 0.62
  radial_width: 0.11
  max_coordinate_update: 0.22

flow:
  time_frequencies: 4
  velocity_scale: 3.0

training:
  learning_rate: 0.002
  beta1: 0.9
  beta2: 0.999
  epsilon: 1.0e-8
  gradient_clip_norm: 5.0
  weight_decay: 0.0
  jit_step: true

sampling:
  num_steps: 16
  integrator: heun

reporting:
  num_samples_per_condition: 4
  evaluation_seed: 991
  sampling_seed: 992
  overlap_threshold: 0.12
  physical_r0: 0.14
  physical_kappa: 38.0

finite_difference:
  objective_seed: 993
  direction_seed: 994
  epsilons: [0.003, 0.001, 0.0003]
  jit_objective: true

acceptance:
  minimum_training_loss_reduction: 1.005
  maximum_gradient_relative_error: 0.0001
  maximum_mean_velocity_norm: 1.0e-10
