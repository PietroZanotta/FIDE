[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mfsi"
version = "0.1.0"
description = "Small JAX-first core for measurement-conditioned flow experiments"
requires-python = ">=3.11"
dependencies = ["jax>=0.4", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]
