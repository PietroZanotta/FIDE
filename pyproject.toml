[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manybody-scientific-ablation"
version = "0.2.0"
description = "Homometric scientific comparisons with classical baselines, solver-aware flows, and conditional UQ"
requires-python = ">=3.11,<3.15"
dependencies = [
  "jax==0.8.1",
  "numpy>=2,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
cuda = ["jax[cuda]==0.8.1"]
test = ["pytest>=8,<9"]

[project.scripts]
mbc-run-homometric-ablation = "manybody_completion.cli:main"
mbc-run-scientific-comparison = "manybody_completion.comparison_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
